<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:x="http://myfaces.apache.org/tomahawk"
    xmlns:intranda="http://xmlns.jcp.org/jsf/composite/composites"
    xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
    xmlns:p="http://primefaces.org/ui"
    xmlns:util="http://goobi.io/util">

    <composite:interface>
    </composite:interface>

    <composite:implementation>

        <util:missing-rights rights="Plugin_Goobi_ProjectExport">
            <h:form id="projectExportForm">

                <intranda:box
                    boxType="action"
                    boxPadding="false"
                    boxForm="true"
                    icon="plug"
                    title="#{msgs[NavigationForm.workflowPlugin.title]}">

                    <intranda:formInputDropDownAjax
                        ajaxEvent="change"
                        ajaxRender="projectExportForm"
                        label="#{msgs.projekt}"
                        field="#{NavigationForm.workflowPlugin.projectName}"
                        help=""
                        name="project"
                        selectItems="#{NavigationForm.workflowPlugin.allProjectNames}"
                        required="false"
                        itemValue="#{var}"
                        itemLabel="#{var}"
                        hidePleaseSelectMessage="false"/>

                    <intranda:formInputCheckBoxAjax
                        id="checkIncludeProcesses"
                        label="#{msgs.plugin_workflow_projectexport_includeFinishedProcesses}"
                        field="#{NavigationForm.workflowPlugin.includeAllFinishedProcesses}"
                        help="#{msgs.help_institution_allowAllRulesets}"
                        name="checkIncludeProcesses"
                        ajaxEvent="change"
                        ajaxRender="projectExportForm"/>

                    <util:alert
                        type="info"
                        message="#{NavigationForm.workflowPlugin.projectSizeMessage}"
                        styleClass="m-3 d-block"
                        rendered="#{NavigationForm.workflowPlugin.exportPossible and NavigationForm.workflowPlugin.projectSizeMessage != null}" />

                    <util:alert
                        type="warning"
                        message="#{NavigationForm.workflowPlugin.projectValidationError}"
                        styleClass="m-3 d-block"
                        rendered="#{!NavigationForm.workflowPlugin.stepsComplete and NavigationForm.workflowPlugin.projectValidationError != null}" />

                    <h:panelGroup
                        styleClass="form-actions"
                        rendered="#{NavigationForm.workflowPlugin.exportPossible}">
                        <h:commandLink
                            styleClass="btn btn-primary submitOnEnter"
                            id="export"
                            type="submit"
                            action="#{NavigationForm.workflowPlugin.prepareExport}">
                            <util:icon-text icon="#{NavigationForm.workflowPlugin.allowZipDownload?'download':'world'}" text="#{msgs.exportFiles}" />
                        </h:commandLink>
                    </h:panelGroup>
                </intranda:box>
            </h:form>
        </util:missing-rights>
    </composite:implementation>

</ui:composition>
